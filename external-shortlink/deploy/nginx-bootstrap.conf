# Temporary HTTP-only virtual host used only to obtain the first jzbe.ir
# certificate. The deployment script removes its enabled symlink afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name jzbe.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/external-shortlink-acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
