# Dedicated pgAdmin reverse-proxy vhost. This file is rendered by deploy-beta.sh
# into a directory mounted only by pgadmin-nginx-beta; do not add it to the main
# nginx-beta configuration, or it would create an application-network bridge.

upstream pgadmin_ui {
    server 172.31.0.10:5050 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

server {
    listen 14433 ssl;
    listen [::]:14433 ssl;
    http2 on;
    server_name ${PGADMIN_DOMAIN};

    # Reuse the existing certificate material for ${DOMAIN}. It must cover
    # pg.${DOMAIN}, either as a SAN or with a wildcard name.
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    # Apply the common security headers here as this virtual host also adds
    # Cache-Control. pgAdmin's own CSP is passed through below.
    include /etc/nginx/security.conf;
    add_header Cache-Control "no-store, private" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # All paths, including the pgAdmin login page and static resources, need
    # this first authentication factor. The htpasswd file is a Docker secret.
    auth_basic "Restricted pgAdmin access";
    auth_basic_user_file /run/secrets/pgadmin_nginx_htpasswd;

    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;
    # pgAdmin's HTTP/2 UI loads many modules in parallel. Nginx counts each
    # concurrent HTTP/2 request here, so 10 rejects normal browser assets.
    # This remains below the application's general per-IP ceiling.
    limit_conn conn_limit_per_ip 50;
    limit_req zone=pgadmin burst=60 nodelay;

    if ($host != ${PGADMIN_DOMAIN}) { return 444; }
    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    location / {
        proxy_pass http://pgadmin_ui;
        include /etc/nginx/proxy.conf;
        # pgAdmin documents X-Scheme for TLS-terminating Nginx proxies.
        proxy_set_header X-Scheme $scheme;
        proxy_connect_timeout 5s;
        # Administrative reports and query results can legitimately take a
        # couple of minutes. Keep the upstream window above that while leaving
        # the connection-establishment timeout short.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
        # pgAdmin provides a CSP compatible with its dynamic UI; the common
        # proxy configuration hides upstream headers by default, so opt back in.
        proxy_pass_header Content-Security-Policy;
    }
}
