# Nginx/OpenResty Configuration for Yamata no Orochi Production
user nobody;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    map $request_method $block_proxy_method {
        default 0;
        CONNECT 1;
        OPTIONS 1;
        TRACE   1;
        TRACK   1;
    }

    map $request_uri $block_absolute_uri {
        default 0;
        ~*^https?:// 1;
    }

    map $http_proxy $has_proxy_header {
        default 1;
        ""      0;
    }

    # The public applications use the edge policy below. GlitchTip, Grafana,
    # and pgAdmin generate application-aware CSP headers (including
    # per-response nonces), so their virtual hosts must not inherit the public
    # frontend policy.
    # add_header omits the header when the mapped value is empty.
    map $host $edge_content_security_policy {
        default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://mipg.atipay.net; script-src 'self'; script-src-attr 'none'; style-src 'self' 'sha256-7ISJtRqQJ7tmxQr12o/kAQKjtIDVwveWdroeO7wrc1w='; style-src-attr 'none'; img-src 'self' data: blob: https://trustseal.enamad.ir; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; media-src 'self' blob:";
        ~*^sentry\.     "";
        ~*^monitoring\. "";
        ~*^pg\.         "";
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"host":"$host",'
            '"scheme":"$scheme",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_id":"$req_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    client_body_buffer_size 256k;
    client_max_body_size 10m;
    client_header_buffer_size 2k;
    large_client_header_buffers 8 8k;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    reset_timedout_connection on;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;
    # pgAdmin is an administrator-only UI. Keep its traffic budget separate
    # from public requests so one cannot exhaust the other.
    limit_req_zone $binary_remote_addr zone=pgadmin:10m rate=120r/m;
    # Grafana loads many assets and issues panel queries in parallel. Keep its
    # traffic isolated from the public site's lower-volume request budget.
    limit_req_zone $binary_remote_addr zone=grafana:10m rate=1200r/m;
    limit_req_status 429;

    limit_req_log_level warn;

    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_status 429;

    include /etc/nginx/security.conf;
    include /etc/nginx/gzip.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/sites-available/*.conf;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
}
