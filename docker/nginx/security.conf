# Public security headers. Include at http scope, and again inside any
# location that defines its own add_header directives such as Cache-Control.
# Requires OpenResty or nginx with headers-more.

server_tokens off;
more_clear_headers Server;
more_clear_headers X-Powered-By;
more_clear_headers X-AspNet-Version;
more_clear_headers X-AspNetMvc-Version;
more_clear_headers X-Generator;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;

# Do not set Cross-Origin-Embedder-Policy unless the app really needs browser
# cross-origin isolation. require-corp commonly breaks third-party seals/images.
# Vendor UIs map this value to empty and supply their own application-aware CSP.
add_header Content-Security-Policy $edge_content_security_policy always;
