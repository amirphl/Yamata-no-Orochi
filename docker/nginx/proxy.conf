# Common reverse-proxy settings. The public edge is the only owner of CORS and
# security headers; upstream copies are hidden to prevent duplicate or unsafe
# policies from reaching browsers.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-ID $req_id;

# httpoxy / proxy-disclosure hardening.
proxy_set_header Proxy "";
proxy_set_header Forwarded "";

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
proxy_busy_buffers_size 16k;
proxy_temp_file_write_size 16k;

proxy_cache_bypass $http_upgrade;
proxy_cache_valid 200 302 10m;
proxy_cache_valid 404 1m;

proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_redirect off;

proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
proxy_hide_header X-Generator;

proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header X-Download-Options;

# Same-origin frontend/API traffic does not need public CORS headers. If you
# later add a trusted cross-origin client, add an explicit allow-list at the
# edge instead of forwarding backend CORS headers.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Access-Control-Request-Method;
proxy_hide_header Access-Control-Request-Headers;
proxy_hide_header Timing-Allow-Origin;

proxy_hide_header Via;
proxy_hide_header Forwarded;
proxy_hide_header X-Forwarded-For;
proxy_hide_header X-Forwarded-Host;
proxy_hide_header X-Forwarded-Proto;
proxy_hide_header X-Forwarded-Port;
proxy_hide_header X-Real-IP;
proxy_hide_header X-Request-ID;
proxy_hide_header X-Cache;
proxy_hide_header X-Cache-Hits;
proxy_hide_header X-Served-By;
proxy_hide_header X-Backend-Server;
proxy_hide_header Proxy-Authenticate;
proxy_hide_header Proxy-Authorization;
