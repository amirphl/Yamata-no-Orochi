# PostgreSQL Client Authentication Configuration for Yamata beta
#
# PostgreSQL runs without SSL inside the private Docker bridge network. External
# TLS is terminated by nginx; database clients authenticate with SCRAM.
#
# TYPE  DATABASE  USER  ADDRESS        METHOD
local   all       all                  trust
host    all       all   127.0.0.1/32   scram-sha-256
host    all       all   ::1/128        scram-sha-256
host    all       all   172.30.0.0/24  scram-sha-256
# pgAdmin has a dedicated, internal-only PostgreSQL network; it must not share
# the application bridge merely to connect to this database.
host    all       all   172.29.0.0/28  scram-sha-256
